<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boss Says — endless office platformer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.4rem;
        letter-spacing: 0.02em;
      }
      .sub {
        margin: 0 0 12px;
        color: #94a3b8;
        font-size: 0.9rem;
        text-align: center;
        max-width: 40rem;
      }
      #game {
        display: block;
        background: #1e293b;
        border: 2px solid #334155;
        border-radius: 8px;
        image-rendering: pixelated;
        max-width: 100%;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      #hint {
        margin-top: 10px;
        font-size: 0.85rem;
        color: #64748b;
      }
      .badge {
        display: inline-block;
        background: #ef4444;
        color: #fff;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 999px;
        vertical-align: middle;
        margin-left: 6px;
      }
      noscript {
        color: #f87171;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Boss Says <span class="badge">99+</span></h1>
    <p class="sub">
      Endless Mario-like at one AI software company. Ship the deploy flag —
      sprint loops forever. CEO/CTO Slack is the real boss.
    </p>
    <canvas id="game" width="800" height="480" aria-label="Boss Says game"></canvas>
    <p id="hint">Loading…</p>
    <noscript>Enable JavaScript to play Boss Says.</noscript>

    <!-- Plain scripts: file:// safe (no ES modules) -->
    <script src="js/physics.js"></script>
    <script src="js/map.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/game.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
