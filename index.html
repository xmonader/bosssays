<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Endless Mario-like office platformer. Ship deploys. Survive CEO/CTO Slack." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%230f172a' width='32' height='32' rx='6'/%3E%3Ctext y='23' x='4' font-size='18'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E" />
    <title>Boss Says — endless office platformer</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: max(6px, env(safe-area-inset-top))
          max(8px, env(safe-area-inset-right))
          max(8px, env(safe-area-inset-bottom))
          max(8px, env(safe-area-inset-left));
      }
      #app {
        width: min(100%, 1280px);
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
      }
      header {
        text-align: center;
        width: 100%;
        margin-bottom: 4px;
      }
      h1 {
        margin: 0 0 2px;
        font-size: clamp(1.05rem, 3.5vw, 1.35rem);
        letter-spacing: 0.02em;
      }
      .sub {
        margin: 0 0 6px;
        color: #94a3b8;
        font-size: clamp(0.75rem, 2.4vw, 0.88rem);
        text-align: center;
        max-width: 40rem;
        line-height: 1.35;
      }
      @media (max-width: 700px) {
        .sub .desk-only {
          display: none;
        }
      }
      #stage {
        position: relative;
        width: min(96vw, 1280px);
        max-height: min(70dvh, calc(100dvh - 220px));
      }
      @media (max-width: 700px) {
        #stage {
          max-height: min(52dvh, calc(100dvh - 240px));
          width: 100%;
        }
      }
      #game {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1280 / 768;
        max-height: inherit;
        object-fit: contain;
        background: #1e293b;
        border: 2px solid #334155;
        border-radius: 10px;
        image-rendering: pixelated;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        touch-action: none;
      }
      #hint {
        margin-top: 6px;
        font-size: clamp(0.72rem, 2.2vw, 0.85rem);
        color: #64748b;
        text-align: center;
        max-width: 96vw;
        line-height: 1.35;
        padding: 0 4px;
      }
      .badge {
        display: inline-block;
        background: #ef4444;
        color: #fff;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 999px;
        vertical-align: middle;
        margin-left: 6px;
      }

      /* —— Touch controls (phones / coarse pointers) —— */
      #touch {
        display: none;
        width: min(96vw, 1280px);
        margin-top: 8px;
        gap: 8px;
        user-select: none;
        -webkit-user-select: none;
      }
      #touch .row-move {
        display: flex;
        justify-content: space-between;
        align-items: stretch;
        gap: 10px;
      }
      #touch .cluster {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #touch button,
      #slack-pad button {
        appearance: none;
        border: 2px solid #475569;
        background: rgba(30, 41, 59, 0.92);
        color: #f1f5f9;
        border-radius: 14px;
        font-weight: 700;
        font-size: 1rem;
        min-width: 64px;
        min-height: 64px;
        padding: 10px 14px;
        touch-action: none;
        cursor: pointer;
        box-shadow: 0 4px 0 #0f172a;
      }
      #touch button:active,
      #touch button.held,
      #slack-pad button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #0f172a;
        background: #334155;
      }
      #touch .btn-jump {
        min-width: 96px;
        min-height: 72px;
        background: rgba(37, 99, 235, 0.9);
        border-color: #60a5fa;
        font-size: 1.05rem;
      }
      #touch .btn-slack {
        min-width: 88px;
        background: rgba(220, 38, 38, 0.85);
        border-color: #f87171;
        font-size: 0.9rem;
      }
      #touch .btn-slack.has-mail {
        animation: pulse 1s ease infinite;
      }
      #touch .btn-util {
        min-width: 56px;
        min-height: 48px;
        font-size: 0.8rem;
        opacity: 0.9;
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.45);
        }
      }

      #slack-pad {
        display: none;
        width: min(96vw, 1280px);
        margin-top: 8px;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      #slack-pad.open {
        display: flex;
      }
      #slack-pad button {
        flex: 1 1 42%;
        min-height: 52px;
        font-size: 0.82rem;
        line-height: 1.2;
      }
      #slack-pad .quit {
        flex: 1 1 100%;
        background: rgba(127, 29, 29, 0.95);
        border-color: #ef4444;
        color: #fecaca;
        min-height: 56px;
        font-size: 0.9rem;
      }

      /* Show touch UI on small screens or coarse pointers */
      @media (max-width: 900px), (pointer: coarse) {
        #touch {
          display: block;
        }
        #hint .desk-hint {
          display: none;
        }
      }
      @media (min-width: 901px) and (pointer: fine) {
        #touch {
          display: none;
        }
        #slack-pad.open {
          display: none; /* desktop uses keys 1–5 */
        }
      }
      /* Always allow slack pad on coarse even if wide tablet */
      @media (pointer: coarse) {
        #slack-pad.open {
          display: flex;
        }
      }

      noscript {
        color: #f87171;
        margin-top: 1rem;
      }

      /* Settings / menu */
      #menu-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        margin-bottom: 6px;
        width: min(96vw, 1280px);
      }
      #menu-bar button,
      #settings-panel button,
      #settings-panel select {
        appearance: none;
        border: 1px solid #475569;
        background: #1e293b;
        color: #e2e8f0;
        border-radius: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 6px 10px;
        cursor: pointer;
      }
      #menu-bar button:hover,
      #settings-panel button:hover {
        background: #334155;
      }
      #settings-panel {
        display: none;
        width: min(96vw, 420px);
        background: #1e293b;
        border: 1px solid #475569;
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 8px;
        font-size: 0.85rem;
      }
      #settings-panel.open {
        display: block;
      }
      #settings-panel label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 8px 0;
        color: #cbd5e1;
      }
      #settings-panel .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      #settings-panel h2 {
        margin: 0 0 8px;
        font-size: 1rem;
      }
      #best-line {
        color: #94a3b8;
        font-size: 0.78rem;
        margin: 4px 0 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Boss Says <span class="badge">99+</span></h1>
        <p class="sub">
          Ship deploys. Survive Slack.
          <span class="desk-only">
            Grab <strong>SP</strong> &amp; <strong>☕</strong>. Open inbox when
            <em>you</em> want.
          </span>
        </p>
        <p id="best-line"></p>
      </header>

      <div id="menu-bar">
        <button type="button" id="btn-settings" aria-expanded="false">Settings</button>
        <button type="button" id="btn-mode-normal" data-mode="normal">Normal</button>
        <button type="button" id="btn-mode-daily" data-mode="daily">Daily</button>
        <button type="button" id="btn-mode-noslack" data-mode="noslack">No Slack</button>
        <button type="button" id="btn-share" title="Share run card">Share</button>
      </div>

      <div id="settings-panel" aria-label="Game settings">
        <h2>Settings</h2>
        <label>
          Difficulty
          <select id="set-difficulty">
            <option value="chill">Chill</option>
            <option value="mid" selected>Mid</option>
            <option value="toxic">Toxic</option>
          </select>
        </label>
        <label>
          Compact HUD
          <input type="checkbox" id="set-compact" />
        </label>
        <label>
          Reduce motion
          <input type="checkbox" id="set-motion" />
        </label>
        <label>
          Colorblind-ish meters
          <input type="checkbox" id="set-cb" />
        </label>
        <label>
          SFX
          <input type="checkbox" id="set-sfx" checked />
        </label>
        <label>
          BGM
          <input type="checkbox" id="set-bgm" checked />
        </label>
        <div class="row">
          <button type="button" id="set-apply">Apply &amp; new run</button>
          <button type="button" id="set-close">Close</button>
        </div>
      </div>

      <div id="stage">
        <canvas
          id="game"
          width="1280"
          height="768"
          aria-label="Boss Says game"
        ></canvas>
      </div>

      <div id="touch" aria-label="Touch controls">
        <div class="row-move">
          <div class="cluster">
            <button type="button" data-hold="left" aria-label="Move left">◀</button>
            <button type="button" data-hold="right" aria-label="Move right">▶</button>
          </div>
          <div class="cluster">
            <button type="button" data-tap="slack" class="btn-slack" id="btn-slack">
              Slack
            </button>
            <button type="button" data-tap="mute" class="btn-util" id="btn-mute">
              Mute
            </button>
            <button type="button" data-tap="restart" class="btn-util" id="btn-restart">
              R
            </button>
          </div>
          <div class="cluster">
            <button type="button" data-hold="jump" class="btn-jump" aria-label="Jump">
              JUMP
            </button>
          </div>
        </div>
      </div>

      <div id="slack-pad" aria-label="Slack replies">
        <button type="button" data-reply="dismiss">1 Mute</button>
        <button type="button" data-reply="on_it">2 On it!!</button>
        <button type="button" data-reply="love">3 Love this</button>
        <button type="button" data-reply="pushback">4 Pushback</button>
        <button type="button" data-reply="quit" class="quit">
          5 FUCK YOU I QUIT
        </button>
      </div>

      <p id="hint">Loading…</p>
      <noscript>Enable JavaScript to play Boss Says.</noscript>
    </div>

    <script src="js/physics.js"></script>
    <script src="js/map.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/meta.js"></script>
    <script src="js/game.js"></script>
    <script src="js/render.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
